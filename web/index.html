<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native Remesher Web</title>
<style>
  :root { --bg:#14171b; --panel:#1d2127; --line:#2b323b; --fg:#e6e9ee; --dim:#98a2b0; --accent:#4f8cff; --bad:#ff6b6b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f3f5f8; --panel:#fff; --line:#d5dbe3; --fg:#1b2027; --dim:#5d6877; --accent:#2f6fe4; --bad:#c62828; } }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui,sans-serif; display:grid; grid-template-columns:340px 1fr; height:100vh }
  aside { background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:12px 14px 40px }
  #view { position:relative; min-width:0 } #view canvas { display:block; width:100%; height:100% }
  h1 { font-size:15px; margin:0 0 10px } h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:18px 0 6px; border-bottom:1px solid var(--line); padding-bottom:4px }
  label.row { display:flex; gap:8px; align-items:flex-start; margin:5px 0 } label.row.off { opacity:.45 }
  .seg { display:flex; gap:4px; flex-wrap:wrap; margin:4px 0 } .seg button { flex:1 } .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent) }
  button, select, input[type=number] { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; font:inherit }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); width:100%; padding:9px; font-weight:600 }
  button:disabled { opacity:.5 } .note { color:var(--dim); font-size:12px; margin:4px 0 } .err { color:var(--bad) }
  #drop { border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center; color:var(--dim) } #drop.over { border-color:var(--accent); color:var(--fg) }
  progress { width:100%; height:8px } details summary { cursor:pointer; color:var(--dim) } .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px } .kv b { font-weight:500; color:var(--dim) }
  #overlay { position:absolute; right:10px; top:10px; display:flex; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px }
  @media (max-width:720px) { body { grid-template-columns:1fr; grid-template-rows:55vh 1fr; height:auto } #view { order:-1; height:55vh } aside { border-right:0 } }
</style>
</head>
<body>
<aside id="panel"></aside>
<div id="view"><div id="overlay"><label><input type="checkbox" id="vsrc" checked> source</label><label><input type="checkbox" id="vres" checked> result</label></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
